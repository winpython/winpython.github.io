name: test_site
# The generator writes into md5_sha1.txt and releases.html, which people read
# directly, so it gets the same treatment as the winpython test suite:
# hash-pinned dependencies, run on anything that touches it.
#
# The pins are the same set winpython/tests/requir.wppmtest.txt carries. To
# refresh them, regenerate there and copy the file across.

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test_site.yml'
      - 'tests/**'
      - 'md5_sha1.txt'
      - 'releases.html'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test_site.yml'
      - 'tests/**'
      - 'md5_sha1.txt'
      - 'releases.html'
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned test dependencies
        run: python -m pip install --no-deps --require-hashes -r tests/requirements.txt

      - name: Run the tests
        run: python -m pytest -q

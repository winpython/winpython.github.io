# The sentences a release needs that no build can know.
#
# Everything else the site says about a release -- versions, flavors, formats,
# sizes, hashes, every download URL -- is read off the hashes_*.md the build
# uploads. This file is the whole of the per-cycle hand edit.
#
# It currently holds 2026-04, the last final release, so it is a worked example
# rather than a template of placeholders. Editing it for a cycle means: the
# release block, and the [release.pythons] line for each minor.

[release]
# title as it appears in the archive and in md5_sha1.txt
title = "WinPython 2026-04"
# publication date; leave out to use the day the generator runs
date = "2026-10-27"
# the suffix on file names, "" for a final. Betas do not go on the site, so
# this is normally "" -- it exists because the file names carry it.
level = ""
notes_url = "https://github.com/winpython/winpython/releases/tag/2026-04"
highlights = """Python-3.13.18, Python-3.14.10, Python-3.15.2, numpy-2.5.3, pandas-3.0.5, scipy-1.18.1,
           polars-2.1.0, duckdb-2.0.0, numba-0.68.0, jupyterlab-4.6.4, spyder-6.1.7, wppm-17.14.20261027"""

# The interpreter each WinPython minor ships. Not derivable: WinPython 3.15.0.4
# shipped Python 3.15.0rc1, and the fourth number is WinPython's own.
[release.pythons]
"3.13" = "3.13.18"
"3.14" = "3.14.10"
"3.15" = "3.15.2"

# How each flavor is described. Stable between cycles; a new flavor needs a line.
[flavors.dot]
archive = "bare portable Python"

[flavors.slim]
archive = "full scientific environment"

[flavors.dotf]
archive = "bare portable Python, free-threading"

[flavors.slimf]
archive = "free-threading, no Qt stack"

[flavors.whl]
archive = "offline wheelhouse"
